<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#0D1B2A" />
<title>Presupuestador Profesional</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --navy:#0D1B2A; --navy-mid:#1B2D45; --navy-light:#243B53;
  --electric:#1E88E5; --electric-light:#42A5F5;
  --gold:#FFB300; --gold-dark:#E6A200;
  --dark:#0A1628; --white:#FFFFFF;
  --mid-gray:#7B8FA1; --border:#2A3E55;
  --success:#43A047; --danger:#E53935;
  --text-light:#CBD5E0; --text-body:#E2E8F0;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:var(--navy);color:var(--white);min-height:100vh}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea{font-family:inherit;outline:none}

/* HEADER */
.app-header{background:linear-gradient(135deg,var(--dark),var(--navy),var(--navy-mid));padding:16px 18px;border-bottom:3px solid var(--electric)}
.app-header-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo-title{display:flex;align-items:center;gap:12px;min-width:0;flex:1}
.logo-box{width:42px;height:42px;background:linear-gradient(135deg,var(--gold),var(--gold-dark));border-radius:10px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(255,179,0,0.27);flex-shrink:0}
.app-title{font-size:15px;font-weight:800;letter-spacing:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.app-subtitle{font-size:10px;color:var(--electric-light);letter-spacing:0.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{background:transparent;border:1px solid var(--border);color:var(--electric-light);width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.icon-btn:hover{background:var(--dark)}

.presup-badge{margin-top:12px;display:flex;justify-content:center}
.presup-badge-inner{background:rgba(255,179,0,0.08);border:1px solid rgba(255,179,0,0.2);border-radius:8px;padding:6px 16px;display:flex;align-items:center;gap:10px}
.presup-badge-label{font-size:10px;color:var(--gold);letter-spacing:1px;font-weight:600;text-transform:uppercase}
.presup-badge-value{font-size:14px;font-weight:700;color:var(--gold)}

/* STEPS */
.steps{display:flex;background:var(--dark);overflow-x:auto}
.step{flex:1 1 0;min-width:80px;padding:12px 6px;text-align:center;font-size:10px;font-weight:600;color:var(--mid-gray);border-bottom:3px solid transparent;display:flex;flex-direction:column;align-items:center;gap:4px;line-height:1.2;cursor:pointer;transition:all 0.2s}
.step-num{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;font-size:11px;background:var(--border);color:var(--mid-gray);font-weight:700}
.step.active{color:var(--gold);border-bottom-color:var(--gold)}
.step.active .step-num{background:var(--gold);color:var(--navy)}
.step.done{color:var(--electric);border-bottom-color:rgba(30,136,229,0.2)}
.step.done .step-num{background:var(--electric);color:var(--navy)}

/* CONTENT */
.content{padding:20px 18px;max-width:900px;margin:0 auto}

.section-label{display:flex;align-items:center;gap:10px;margin:22px 0 12px}
.section-label-text{font-size:10px;text-transform:uppercase;letter-spacing:2px;color:var(--gold);font-weight:700;white-space:nowrap}
.section-label-text.blue{color:var(--electric)}
.section-label-line{flex:1;height:1px;background:linear-gradient(90deg,rgba(255,179,0,0.4),transparent)}
.section-label-line.blue{background:linear-gradient(90deg,rgba(30,136,229,0.4),transparent)}

.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-grid.full{grid-template-columns:1fr}
.field{display:flex;flex-direction:column;gap:4px}
.field.full{grid-column:1/-1}
.field label{font-size:11px;color:var(--mid-gray);text-transform:uppercase;letter-spacing:1px;font-weight:600}
.field input,.field textarea{width:100%;background:var(--dark);border:1px solid var(--border);border-radius:8px;padding:10px 14px;color:var(--white);font-size:14px;line-height:1.6;transition:border 0.2s}
.field input:focus,.field textarea:focus{border-color:var(--electric)}
.field textarea{resize:vertical;min-height:80px}

.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 18px;border-radius:8px;font-size:13px;font-weight:600;transition:all 0.2s;justify-content:center}
.btn:disabled{opacity:0.5;cursor:not-allowed}
.btn-primary{background:linear-gradient(135deg,var(--electric),var(--electric-light));color:#fff}
.btn-gold{background:linear-gradient(135deg,var(--gold),var(--gold-dark));color:var(--navy)}
.btn-ghost{background:transparent;color:var(--electric);border:1px solid var(--border)}
.btn-danger{background:transparent;color:var(--danger);border:1px solid rgba(229,57,53,0.3)}

.btn-row{display:flex;justify-content:space-between;margin-top:20px;flex-wrap:wrap;gap:10px}
.btn-row-right{display:flex;gap:10px;flex-wrap:wrap}

/* CATALOG */
.catalog-btn-row{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.catalog-box{background:var(--dark);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:16px;max-height:280px;overflow-y:auto}
.catalog-category{margin-bottom:10px}
.catalog-cat-title{font-size:10px;font-weight:700;color:var(--electric);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:5px}
.catalog-items{display:flex;flex-wrap:wrap;gap:5px}
.catalog-item{background:var(--navy-mid);border:1px solid var(--border);border-radius:6px;padding:5px 10px;color:var(--white);font-size:11px;transition:border-color 0.15s}
.catalog-item:hover{border-color:var(--electric)}

.add-service-box{background:var(--dark);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:16px}
.add-service-title{font-size:10px;font-weight:700;color:var(--gold);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:10px}

.service-card{background:var(--dark);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:10px}
.service-card-head{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.service-num{background:linear-gradient(135deg,var(--electric),var(--electric-light));color:#fff;font-size:12px;font-weight:800;width:30px;height:30px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.service-title{font-size:14px;font-weight:600;flex:1}
.service-remove{background:transparent;color:var(--danger);font-size:22px;padding:4px 10px;line-height:1}
.service-items{margin-left:40px}
.service-item-row{display:flex;gap:6px;align-items:flex-start;margin-bottom:3px}
.service-item-bullet{color:var(--electric);font-size:10px;margin-top:3px}
.service-item-text{font-size:12px;color:var(--text-light)}

.empty-msg{text-align:center;padding:36px;color:var(--mid-gray)}
.empty-msg-text{margin-top:8px;font-size:13px}

.pay-condition-row{display:flex;gap:6px;margin-bottom:6px;align-items:center}
.pay-condition-row input{flex:1;background:var(--dark);border:1px solid var(--border);border-radius:6px;padding:8px 12px;color:var(--white);font-size:13px}
.pay-add-btn{background:transparent;border:1px dashed var(--border);border-radius:6px;padding:6px 12px;color:var(--mid-gray);font-size:12px;width:100%}

.summary-box{background:linear-gradient(135deg,var(--dark),var(--navy-mid));border:1px solid var(--border);border-radius:12px;padding:18px}
.summary-row{display:flex;justify-content:space-between;padding:5px 0;font-size:13px}
.summary-row-label{color:var(--mid-gray)}
.summary-row-value{font-weight:500}
.summary-total{display:flex;justify-content:space-between;padding:12px 0 0;margin-top:8px;border-top:2px solid var(--electric);font-size:20px;font-weight:800}
.summary-total-value{color:var(--gold)}

/* CUSTOMIZATION */
.customize-info-box{background:linear-gradient(135deg,var(--dark),var(--navy-mid));border:1px solid rgba(255,179,0,0.27);border-radius:12px;padding:16px;margin-bottom:18px}
.customize-info-title{display:flex;align-items:center;gap:10px;margin-bottom:6px;font-size:14px;font-weight:700;color:var(--gold)}
.customize-info-text{font-size:12px;color:var(--text-light);line-height:1.6}

.logo-box-row{background:var(--dark);border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:16px;display:flex;gap:18px;align-items:center}
.logo-preview{width:90px;height:90px;border-radius:12px;background:var(--navy-mid);border:2px dashed var(--border);display:flex;align-items:center;justify-content:center;overflow:hidden;padding:6px;flex-shrink:0}
.logo-preview.has-logo{background:#fff}
.logo-preview img{max-width:100%;max-height:100%;object-fit:contain}
.logo-info{flex:1}
.logo-info-title{font-size:13px;font-weight:600;margin-bottom:4px}
.logo-info-text{font-size:11px;color:var(--mid-gray);margin-bottom:10px;line-height:1.5}
.logo-actions{display:flex;gap:8px;flex-wrap:wrap}
.logo-upload{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:8px;background:linear-gradient(135deg,var(--electric),var(--electric-light));color:#fff;font-size:12px;font-weight:600;cursor:pointer}
.logo-upload input{display:none}

.presets-box{background:var(--dark);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:16px}
.presets-group-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.presets-group-title.dark-title{color:var(--electric)}
.presets-group-title.light-title{color:var(--gold);margin-top:16px}
.presets-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.preset{background:var(--navy-mid);border:2px solid var(--border);border-radius:10px;padding:10px;text-align:left;transition:all 0.2s}
.preset.active{border-color:var(--gold)}
.preset-swatches{display:flex;gap:3px;margin-bottom:6px}
.preset-swatch{flex:1;height:24px;border-radius:4px}
.preset-name{font-size:11px;font-weight:600;color:var(--white)}
.preset.active .preset-name{color:var(--gold)}

.color-picker-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.color-picker{display:flex;flex-direction:column;gap:6px}
.color-picker label{font-size:11px;color:var(--mid-gray);text-transform:uppercase;letter-spacing:1px;font-weight:600}
.color-picker-row{display:flex;gap:8px;align-items:center}
.color-picker-swatch{position:relative;width:44px;height:44px;border-radius:10px;overflow:hidden;border:2px solid var(--border);cursor:pointer;flex-shrink:0}
.color-picker-swatch .swatch-color{width:100%;height:100%}
.color-picker-swatch input[type=color]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;border:none}
.color-picker-text{flex:1;background:var(--dark);border:1px solid var(--border);border-radius:8px;padding:10px 14px;color:var(--white);font-size:13px;font-family:monospace;text-transform:uppercase}

.mini-preview{background:#fff;border-radius:12px;overflow:hidden;margin-bottom:16px;box-shadow:0 4px 20px rgba(0,0,0,0.3)}
.mini-preview iframe{width:100%;height:400px;border:none;display:block}

/* PREVIEW */
.preview-frame{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 8px 40px rgba(0,0,0,0.4)}
.preview-frame iframe{width:100%;height:70vh;border:none;display:block}

/* CONFIG SCREEN */
.config-screen{background:var(--navy);min-height:100vh;color:var(--white)}
.config-header{background:linear-gradient(135deg,var(--dark),var(--navy),var(--navy-mid));padding:24px;border-bottom:3px solid var(--electric);text-align:center}
.config-icon{display:inline-flex;align-items:center;justify-content:center;width:60px;height:60px;background:linear-gradient(135deg,var(--gold),var(--gold-dark));border-radius:14px;margin-bottom:14px;box-shadow:0 6px 24px rgba(255,179,0,0.33)}
.config-title{font-size:22px;font-weight:900;letter-spacing:1px;margin-bottom:6px}
.config-subtitle{font-size:13px;color:var(--electric-light);max-width:500px;margin:0 auto;line-height:1.6}
.config-body{padding:24px;max-width:720px;margin:0 auto}
.config-footer{display:flex;justify-content:space-between;align-items:center;margin-top:30px;padding-top:20px;border-top:1px solid var(--border);flex-wrap:wrap;gap:10px}
.config-required{font-size:11px;color:var(--mid-gray)}

/* SPINNER */
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.spinner{animation:spin 1s linear infinite;display:inline-block}

/* SCROLLBAR */
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:var(--dark)}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--electric)}

/* FADE IN */
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.fade-in{animation:fadeIn 0.3s ease}

.hidden{display:none !important}
</style>
</head>
<body>

<!-- CONFIG SCREEN -->
<div id="configScreen" class="config-screen hidden">
  <div class="config-header">
    <div class="config-icon">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#0D1B2A" stroke-width="2.5"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
    </div>
    <div class="config-title" id="configScreenTitle">¡BIENVENIDO!</div>
    <div class="config-subtitle" id="configScreenSubtitle">Antes de empezar, configurá los datos de tu empresa. Solo se cargan una vez y aparecerán automáticamente en todos tus presupuestos.</div>
  </div>
  <div class="config-body">
    <div class="section-label"><span class="section-label-text">Datos de la Empresa</span><div class="section-label-line"></div></div>
    <div class="form-grid">
      <div class="field full"><label>Nombre de la empresa *</label><input id="cfg_nombre" placeholder="Ej: Soluciones Eléctricas"></div>
      <div class="field full"><label>Lema / Subtítulo</label><input id="cfg_subtitulo" placeholder="Ej: Instalaciones • Certificaciones • Consultoría"></div>
    </div>

    <div class="section-label"><span class="section-label-text blue">Datos del Matriculado</span><div class="section-label-line blue"></div></div>
    <div class="form-grid">
      <div class="field full"><label>Nombre del matriculado *</label><input id="cfg_titular" placeholder="Ej: Juan Pérez"></div>
      <div class="field full"><label>Título profesional</label><input id="cfg_titulo" placeholder="Ej: Téc. Electromecánico Matriculado"></div>
      <div class="field"><label>Matrícula principal</label><input id="cfg_mat1" placeholder="Ej: COPIME T000000"></div>
      <div class="field"><label>Matrícula adicional (opcional)</label><input id="cfg_mat2" placeholder="Ej: COPIME R000000"></div>
    </div>

    <div class="section-label"><span class="section-label-text">Contacto</span><div class="section-label-line"></div></div>
    <div class="form-grid">
      <div class="field full"><label>Dirección</label><input id="cfg_direccion" placeholder="Ej: Av. Corrientes 1234, Of. 5 – CABA"></div>
      <div class="field"><label>Teléfono</label><input id="cfg_telefono" placeholder="Ej: 11 1234-5678"></div>
      <div class="field"><label>Email</label><input id="cfg_email" placeholder="Ej: contacto@empresa.com"></div>
      <div class="field"><label>Validez por defecto (días)</label><input id="cfg_validez" placeholder="15" value="15"></div>
      <div></div>
    </div>

    <div class="config-footer">
      <button class="btn btn-ghost hidden" id="btnCfgCancel">← Cancelar</button>
      <div class="config-required" id="cfgRequiredHint">* Campos obligatorios</div>
      <button class="btn btn-gold" id="btnCfgSave" disabled>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
        <span id="btnCfgSaveText">Empezar a usar</span>
      </button>
    </div>
  </div>
</div>

<!-- MAIN APP -->
<div id="mainApp" class="hidden">
  <div class="app-header">
    <div class="app-header-top">
      <div class="logo-title">
        <div class="logo-box"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0D1B2A" stroke-width="2.5"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg></div>
        <div style="min-width:0;flex:1">
          <div class="app-title">PRESUPUESTADOR</div>
          <div class="app-subtitle" id="empresaNameHeader">Configurá tu empresa</div>
        </div>
      </div>
      <button class="icon-btn" id="btnOpenConfig" title="Configuración">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </div>
    <div class="presup-badge">
      <div class="presup-badge-inner">
        <span class="presup-badge-label">N° Presupuesto</span>
        <span class="presup-badge-value" id="nroPresupHeader">-</span>
      </div>
    </div>
  </div>

  <div class="steps" id="stepsBar"></div>

  <div class="content" id="contentArea"></div>
</div>

<script>
// ═══════════════════════════════════════════════════════════
// CONSTANTS
// ═══════════════════════════════════════════════════════════
const EMPRESA_DEFAULT = {
  nombre:"", subtitulo:"Instalaciones • Certificaciones • Consultoría Técnica",
  titular:"", titulo:"Téc. Electromecánico Matriculado",
  matricula1:"", matricula2:"", direccion:"", telefono:"", email:"", validez:15
};

const THEME_DEFAULT = {
  fondo:"#0D1B2A", fondoOscuro:"#0A1628",
  acento:"#1E88E5", acentoClaro:"#42A5F5",
  dorado:"#FFB300", doradoOscuro:"#E6A200",
  logo:null
};

const SERVICIOS_CATALOGO = [
  {cat:"Instalaciones", items:[
    "Instalación eléctrica domiciliaria completa",
    "Instalación eléctrica comercial / industrial",
    "Instalación de tablero seccional",
    "Instalación de puesta a tierra (PAT)",
    "Instalación de disyuntor diferencial",
    "Tendido de cableado y cañerías",
    "Instalación de iluminación LED",
    "Armado de pilar T2 según proyecto",
    "Instalación de tomacorrientes y llaves"
  ]},
  {cat:"Mantenimiento y Reparación", items:[
    "Mantenimiento preventivo de instalación eléctrica",
    "Reparación de cortocircuitos",
    "Cambio de termomagnéticas y diferenciales",
    "Reparación de tablero eléctrico",
    "Búsqueda y reparación de fallas eléctricas"
  ]},
  {cat:"Certificaciones y Mediciones", items:[
    "Medición de puesta a tierra y continuidad (Res. SRT 900/15)",
    "Certificado de instalación eléctrica (DCI)",
    "Informe técnico de instalación",
    "Relevamiento eléctrico completo"
  ]},
  {cat:"Trámites y Gestiones", items:[
    "Ampliación de potencia eléctrica ante EDESUR",

    "Tramitación de Encomienda profesional",

  {cat:"Obras Especiales", items:[
    "Automatización de iluminación",
    "Instalación de grupo electrógeno",
    "Canalización y bandejas portacables"
  ]}
];

const PRESETS = [
  {name:"Azul Profesional", modo:"oscuro", fondo:"#0D1B2A", fondoOscuro:"#0A1628", acento:"#1E88E5", acentoClaro:"#42A5F5", dorado:"#FFB300", doradoOscuro:"#E6A200"},

function formatCurrency(n){
  if(!n && n!==0) return "$0";
  return "$ " + Number(n).toLocaleString("es-AR",{minimumFractionDigits:0});
}

function numberToWords(n){
  if(!n || n===0) return "cero";
  const u=["","un","dos","tres","cuatro","cinco","seis","siete","ocho","nueve"];
  const d=["","diez","veinte","treinta","cuarenta","cincuenta","sesenta","setenta","ochenta","noventa"];
  const ds=["diez","once","doce","trece","catorce","quince","dieciséis","diecisiete","dieciocho","diecinueve"];
  const c=["","cien","doscientos","trescientos","cuatrocientos","quinientos","seiscientos","setecientos","ochocientos","novecientos"];
  const cg=(num)=>{
    if(num===0) return "";
    if(num===100) return "cien";
    let r="";
    if(num>=100){r+=c[Math.floor(num/100)]+" ";num%=100}
    if(num>=20){r+=d[Math.floor(num/10)];if(num%10) r+=" y "+u[num%10]}
    else if(num>=10) r+=ds[num-10];
    else if(num>0) r+=u[num];
    return r.trim();
  };
  if(n>=1000000){
    const mill=Math.floor(n/1000000); const rest=n%1000000;
    const ms=mill===1?"un millón":cg(mill)+" millones";
    if(rest===0) return ms;
    const th=Math.floor(rest/1000); const un=rest%1000;
    let rs="";
    if(th>0) rs+=(th===1?"mil":cg(th)+" mil");
    if(un>0) rs+=(rs?" ":"")+cg(un);
    return ms+" "+rs;
  }
  if(n>=1000){
    const th=Math.floor(n/1000); const rest=n%1000;
    const ts=th===1?"mil":cg(th)+" mil";
    if(rest===0) return ts;
    return ts+" "+cg(rest);
  }
  return cg(n);
}

function isLight(hex){
  try{
    const h=hex.replace("#","");
    const r=parseInt(h.substr(0,2),16), g=parseInt(h.substr(2,2),16), b=parseInt(h.substr(4,2),16);
    return (r*299+g*587+b*114)/1000 > 155;
  }catch(e){return false}
}

function today(){
  return new Date().toLocaleDateString("es-AR",{day:"2-digit",month:"2-digit",year:"numeric"});
}
function genNro(){
  const d=new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0");
}
function esc(str){
  if(!str) return "";
  return String(str).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

// PDF DOWNLOAD
// ═══════════════════════════════════════════════════════════
async function downloadPDF(){
  if(state.generandoPDF) return;
  state.generandoPDF = true;
  renderContent();

  try {
    const html = generatePDFHTML();
    const iframe = document.createElement("iframe");
    iframe.style.cssText = "position:fixed;top:-10000px;left:-10000px;width:794px;height:1123px;border:none";
    document.body.appendChild(iframe);

    const doc = iframe.contentDocument || iframe.contentWindow.document;
    doc.open(); doc.write(html); doc.close();

    await new Promise(r => {
      const ck = () => doc.readyState === "complete" ? setTimeout(r, 800) : setTimeout(ck, 100);
      ck();
    });

    const images = doc.querySelectorAll("img");
    if(images.length){
      await Promise.all(Array.from(images).map(img =>
        img.complete ? Promise.resolve() : new Promise(res => { img.onload = res; img.onerror = res; })
      ));
    }

    const pageEl = doc.querySelector(".page") || doc.body;
    const canvas = await window.html2canvas(pageEl, {
      scale: 2, useCORS: true, allowTaint: true,
      backgroundColor: theme.fondo,
      width: 794, height: 1123, windowWidth: 794, windowHeight: 1123
    });

    const {jsPDF} = window.jspdf;
    const pdf = new jsPDF({orientation:"portrait", unit:"mm", format:"a4"});
    const imgData = canvas.toDataURL("image/jpeg", 0.95);
    pdf.addImage(imgData, "JPEG", 0, 0, 210, 297, undefined, "FAST");

    const fileName = "Presupuesto_" + state.nroPresupuesto + ".pdf";
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;

    if(isIOS && navigator.share){
      try {
        const blob = pdf.output("blob");
        const file = new File([blob], fileName, {type:"application/pdf"});
        if(navigator.canShare && navigator.canShare({files:[file]})){
          await navigator.share({files:[file], title:fileName});
        } else {
          pdf.save(fileName);
        }
      } catch(e){
        if(e.name !== "AbortError") pdf.save(fileName);
      }
    } else {
      const blob = pdf.output("blob");
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = fileName; a.style.display = "none";
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    document.body.removeChild(iframe);
  } catch(err){
    console.error("Error generando PDF:", err);
    alert("Hubo un problema generando el PDF. Intentá de nuevo.");
  } finally {
    state.generandoPDF = false;
    renderContent();
  }
}

  if(empresa.matricula1 && !state.responsabilidad){
    const mats = [empresa.matricula1, empresa.matricula2].filter(Boolean).join(" y ");
    state.responsabilidad = "Todos los trabajos se ejecutan bajo responsabilidad civil y profesional conforme normativa vigente. La certificación y encomiendas se emiten bajo matrículas "+mats+", garantizando el cumplimiento de la reglamentación AEA aplicable. Se deja constancia que cualquier modificación posterior a la instalación certificada invalida los protocolos emitidos.";
  }

  document.getElementById("configScreen").classList.add("hidden");
  document.getElementById("mainApp").classList.remove("hidden");
  document.getElementById("empresaNameHeader").textContent = empresa.nombre || "Configurá tu empresa";
  document.getElementById("nroPresupHeader").textContent = state.nroPresupuesto;
  renderSteps();
  renderContent();
});

  document.getElementById("configScreen").classList.add("hidden");
  document.getElementById("mainApp").classList.remove("hidden");
});

document.getElementById("btnOpenConfig").addEventListener("click", () => {

});

// ═══════════════════════════════════════════════════════════
// STEPS
// ═══════════════════════════════════════════════════════════
function canNext(){
  if(state.step===0) return state.tituloPresupuesto.trim().length > 0;
  if(state.step===1) return state.servicios.length > 0;
  if(state.step===2) return Number(state.honorarios) > 0;
  return true;
}

function renderSteps(){
  const bar = document.getElementById("stepsBar");
  bar.innerHTML = STEP_TITLES.map((t,i) => {
    const cls = i===state.step ? "active" : (i<state.step ? "done" : "");
    return '<div class="step '+cls+'" data-step="'+i+'"><span class="step-num">'+(i<state.step?"✓":(i+1))+'</span><span>'+t+'</span></div>';
  }).join("");
  bar.querySelectorAll(".step").forEach(el => {
    el.addEventListener("click", () => {
      const s = Number(el.dataset.step);
      if(s <= state.step || canNext()) { state.step = s; renderSteps(); renderContent(); }
    });
  });
}

function gotoStep(s){ state.step = s; renderSteps(); renderContent(); }

// ═══════════════════════════════════════════════════════════
// CONTENT RENDER
// ═══════════════════════════════════════════════════════════
function renderContent(){
  const c = document.getElementById("contentArea");
  if(state.step===0) c.innerHTML = renderStep0();
  else if(state.step===1) c.innerHTML = renderStep1();
  else if(state.step===2) c.innerHTML = renderStep2();
  else if(state.step===3) c.innerHTML = renderStep3();
  else if(state.step===4) c.innerHTML = renderStep4();
  bindStepEvents();
}

// ═══════════════════════════════════════════════════════════
// EVENT BINDINGS
// ═══════════════════════════════════════════════════════════
function bindStepEvents(){
  // Step 0
  const bind = (id, ev, fn) => { const el = document.getElementById(id); if(el) el.addEventListener(ev, fn); };

  bind("i_titulo","input",e=>{state.tituloPresupuesto=e.target.value; document.getElementById("btnNext0").disabled = !canNext();});
  bind("i_nro","input",e=>{state.nroPresupuesto=e.target.value; document.getElementById("nroPresupHeader").textContent = state.nroPresupuesto;});
  bind("i_cliente","input",e=>{state.cliente=e.target.value});
  bind("i_obra","input",e=>{state.direccionObra=e.target.value});
  bind("i_objeto","input",e=>{state.objetoServicio=e.target.value});
  bind("btnNext0","click",()=>gotoStep(1));

  // Step 1
  bind("btnToggleCatalog","click",()=>{state.showCatalog=!state.showCatalog; renderContent();});
  bind("i_svcTitulo","input",e=>{state.newSvcTitulo=e.target.value});
  bind("i_svcItems","input",e=>{state.newSvcItems=e.target.value});
  bind("btnAddService","click",()=>{
    if(state.newSvcTitulo.trim()){
      const items = state.newSvcItems.split("\n").map(s=>s.trim()).filter(Boolean);
      state.servicios.push({titulo:state.newSvcTitulo.trim(), items: items.length?items:[state.newSvcTitulo.trim()]});
      state.newSvcTitulo=""; state.newSvcItems="";
      renderContent();
    }
  });
  document.querySelectorAll("[data-cat-item]").forEach(b => {
    b.addEventListener("click", () => {
      const item = b.dataset.catItem;
      state.servicios.push({titulo:item, items:[item]});
      state.showCatalog = false;
      renderContent();
    });
  });
  document.querySelectorAll("[data-remove]").forEach(b => {
    b.addEventListener("click", () => {
      const idx = Number(b.dataset.remove);
      state.servicios.splice(idx,1);
      renderContent();
    });
  });
  bind("btnBack1","click",()=>gotoStep(0));
  bind("btnNext1","click",()=>gotoStep(2));

  // Step 2
  bind("i_honorarios","input",e=>{
    state.honorarios=e.target.value;
    // Update letras live
    renderContent();
  });
  bind("i_resp","input",e=>{state.responsabilidad=e.target.value});
  document.querySelectorAll("[data-pay]").forEach(inp => {
    inp.addEventListener("input", () => {
      const i = Number(inp.dataset.pay);
      state.condicionPago[i] = inp.value;
    });
  });
  document.querySelectorAll("[data-pay-remove]").forEach(b => {
    b.addEventListener("click", () => {
      const i = Number(b.dataset.payRemove);
      state.condicionPago.splice(i,1);
      renderContent();
    });
  });
  bind("btnAddPay","click",()=>{state.condicionPago.push(""); renderContent();});
  bind("btnBack2","click",()=>gotoStep(1));
  bind("btnNext2","click",()=>gotoStep(3));

  // Step 3
  document.querySelectorAll("[data-preset]").forEach(b => {
    b.addEventListener("click", () => {
      const preset = PRESETS.find(p => p.name === b.dataset.preset);
      if(preset){
        theme = {...theme, fondo:preset.fondo, fondoOscuro:preset.fondoOscuro, acento:preset.acento, acentoClaro:preset.acentoClaro, dorado:preset.dorado, doradoOscuro:preset.doradoOscuro};
        try { localStorage.setItem("theme_config", JSON.stringify(theme)); } catch(e){}
        renderContent();
      }
    });
  });
  document.querySelectorAll("[data-color]").forEach(inp => {
    inp.addEventListener("input", () => {
      theme[inp.dataset.color] = inp.value;
      try { localStorage.setItem("theme_config", JSON.stringify(theme)); } catch(e){}
      renderContent();
    });
  });
  document.querySelectorAll("[data-color-text]").forEach(inp => {
    inp.addEventListener("change", () => {
      theme[inp.dataset.colorText] = inp.value;
      try { localStorage.setItem("theme_config", JSON.stringify(theme)); } catch(e){}
      renderContent();
    });
  });
  bind("i_logo","change",e=>{
    const file = e.target.files?.[0];
    if(!file) return;
    if(file.size > 500*1024){alert("El logo debe pesar menos de 500 KB."); return;}
    const reader = new FileReader();
    reader.onload = ev => {
      theme.logo = ev.target.result;
      try { localStorage.setItem("theme_config", JSON.stringify(theme)); } catch(e){}
      renderContent();
    };
    reader.readAsDataURL(file);
  });
  bind("btnRemoveLogo","click",()=>{
    theme.logo = null;
    try { localStorage.setItem("theme_config", JSON.stringify(theme)); } catch(e){}
    renderContent();
  });
  bind("btnResetTheme","click",()=>{
    theme = {...THEME_DEFAULT, logo: theme.logo};
    try { localStorage.setItem("theme_config", JSON.stringify(theme)); } catch(e){}
    renderContent();
  });
  bind("btnBack3","click",()=>gotoStep(2));
  bind("btnNext3","click",()=>gotoStep(4));
  bind("btnDownload","click",downloadPDF);

  // Step 4
  bind("btnBack4","click",()=>gotoStep(3));
  bind("btnNew","click",()=>{
    state.cliente=""; state.direccionObra=""; state.tituloPresupuesto="";
    state.objetoServicio=""; state.servicios=[]; state.honorarios="";
    state.nroPresupuesto=genNro();
    state.condicionPago=["50% Antes de comenzar el trabajo","50% Contra entrega del trabajo finalizado"];
    document.getElementById("nroPresupHeader").textContent = state.nroPresupuesto;
    gotoStep(0);
  });
}

// ═══════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════
function init(){
  const hasConfig = !!localStorage.getItem("empresa_config");
  if(!hasConfig){
    showConfigScreen(true);
  } else {
    document.getElementById("configScreen").classList.add("hidden");
    document.getElementById("mainApp").classList.remove("hidden");
    document.getElementById("empresaNameHeader").textContent = empresa.nombre || "Configurá tu empresa";
    document.getElementById("nroPresupHeader").textContent = state.nroPresupuesto;

    // Set default responsabilidad
    if(empresa.matricula1 && !state.responsabilidad){
      const mats = [empresa.matricula1, empresa.matricula2].filter(Boolean).join(" y ");
      state.responsabilidad = "Todos los trabajos se ejecutan bajo responsabilidad civil y profesional conforme normativa vigente. La certificación y encomiendas se emiten bajo matrículas "+mats+", garantizando el cumplimiento de la reglamentación AEA aplicable. Se deja constancia que cualquier modificación posterior a la instalación certificada invalida los protocolos emitidos.";
    }

    renderSteps();
    renderContent();
  }
}

init();
</script>
</body>
</html>
